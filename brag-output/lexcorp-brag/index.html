<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08060d; }
      #root { position: relative; width: 100%; height: 100%; }
      .scene { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="52"
      data-width="1920"
      data-height="1080"
    >
      <div id="c1" class="clip scene" data-start="0" data-duration="5" data-track-index="0" data-composition-id="scene1" data-composition-src="compositions/scene1.html"></div>
      <div id="c2" class="clip scene" data-start="5" data-duration="6.5" data-track-index="0" data-composition-id="scene2" data-composition-src="compositions/scene2.html"></div>
      <div id="c3" class="clip scene" data-start="11.5" data-duration="7" data-track-index="0" data-composition-id="scene3" data-composition-src="compositions/scene3.html"></div>
      <div id="c4" class="clip scene" data-start="18.5" data-duration="6.5" data-track-index="0" data-composition-id="scene4" data-composition-src="compositions/scene4.html"></div>
      <div id="c5" class="clip scene" data-start="25" data-duration="7" data-track-index="0" data-composition-id="scene5" data-composition-src="compositions/scene5.html"></div>
      <div id="c6" class="clip scene" data-start="32" data-duration="6.5" data-track-index="0" data-composition-id="scene6" data-composition-src="compositions/scene6.html"></div>
      <div id="c7" class="clip scene" data-start="38.5" data-duration="8" data-track-index="0" data-composition-id="scene7" data-composition-src="compositions/scene7.html"></div>
      <div id="c8" class="clip scene" data-start="46.5" data-duration="5.5" data-track-index="0" data-composition-id="scene8" data-composition-src="compositions/scene8.html"></div>

      <!-- Audio: Music -->
      <audio id="bg" data-start="0" data-duration="52" data-track-index="10" data-volume="0.32" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>

      <!-- Audio: Occasional SFX -->
      <audio id="sfx1" data-start="0.4"  data-duration="0.12" data-track-index="11" data-volume="0.5" src="assets/sfx/impact/impactSoft_medium_000.ogg"></audio>
      <audio id="sfx2" data-start="5.5"  data-duration="0.10" data-track-index="12" data-volume="0.4" src="assets/sfx/interface/switch_001.ogg"></audio>
      <audio id="sfx3" data-start="13.5" data-duration="0.09" data-track-index="13" data-volume="0.5" src="assets/sfx/ui/click1.ogg"></audio>
      <audio id="sfx4" data-start="19.0" data-duration="0.05" data-track-index="14" data-volume="0.4" src="assets/sfx/interface/select_008.ogg"></audio>
      <audio id="sfx5" data-start="25.5" data-duration="0.12" data-track-index="15" data-volume="0.5" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx6" data-start="32.5" data-duration="0.01" data-track-index="16" data-volume="0.4" src="assets/sfx/interface/click_002.ogg"></audio>
      <audio id="sfx7" data-start="40.0" data-duration="0.03" data-track-index="17" data-volume="0.6" src="assets/sfx/interface/glitch_002.ogg"></audio>
      <audio id="sfx8" data-start="47.0" data-duration="1.48" data-track-index="18" data-volume="0.65" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Crossfades between scenes
      tl.fromTo("#c1", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 0);
      tl.to("#c1", { opacity: 0, duration: 0.4 }, 4.6);

      tl.fromTo("#c2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.0);
      tl.to("#c2", { opacity: 0, duration: 0.4 }, 11.1);

      tl.fromTo("#c3", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.5);
      tl.to("#c3", { opacity: 0, duration: 0.4 }, 18.1);

      tl.fromTo("#c4", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 18.5);
      tl.to("#c4", { opacity: 0, duration: 0.4 }, 24.6);

      tl.fromTo("#c5", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 25.0);
      tl.to("#c5", { opacity: 0, duration: 0.4 }, 31.6);

      tl.fromTo("#c6", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 32.0);
      tl.to("#c6", { opacity: 0, duration: 0.4 }, 38.1);

      tl.fromTo("#c7", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 38.5);
      tl.to("#c7", { opacity: 0, duration: 0.4 }, 46.1);

      tl.fromTo("#c8", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 46.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

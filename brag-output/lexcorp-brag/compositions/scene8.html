<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1920px; height: 1080px; overflow: hidden; background: #08060d; font-family: 'Inter', sans-serif; }
      .scene-8 { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .outro-logo { font-size: 110px; font-weight: 900; color: #f8fafc; letter-spacing: -4px; z-index: 10; text-transform: uppercase; }
      .outro-sub { font-size: 28px; color: #94a3b8; font-weight: 500; margin-top: 16px; z-index: 10; }
      .outro-glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(170,59,255,0.18) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene8" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
      <div class="scene-8">
        <div class="outro-glow" id="outro-glow"></div>
        <div class="outro-logo" id="logo">LEXCORP</div>
        <div class="outro-sub" id="sub">100% Sovereign Defense Security. Air-Gapped + Zero-Trust.</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#outro-glow", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.5, ease: "power2.out" }, 0.2);
      tl.fromTo("#logo", { opacity: 0, scale: 0.85, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: "back.out(1.4)" }, 0.5);
      tl.fromTo("#sub", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.2);
      window.__timelines["scene8"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

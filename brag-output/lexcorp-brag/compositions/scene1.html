<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1920px; height: 1080px; overflow: hidden; background: #08060d; font-family: 'Inter', sans-serif; }

      .scene-1 {
        position: absolute; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #08060d;
      }
      .glow-bg {
        position: absolute; width: 900px; height: 900px; border-radius: 50%;
        background: radial-gradient(circle, rgba(170,59,255,0.18) 0%, transparent 70%);
        top: 50%; left: 50%; transform: translate(-50%, -50%);
      }
      .badge-tag {
        font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700;
        color: #c084fc; background: rgba(170,59,255,0.15); border: 1px solid rgba(170,59,255,0.4);
        border-radius: 30px; padding: 8px 24px; letter-spacing: 3px; text-transform: uppercase;
        margin-bottom: 28px; z-index: 10;
      }
      .main-title {
        font-size: 72px; font-weight: 900; color: #f8fafc; letter-spacing: -2.5px;
        text-align: center; line-height: 1.08; text-transform: uppercase; z-index: 10;
      }
      .main-title .gradient-text {
        background: linear-gradient(135deg, #c084fc 0%, #38bdf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .sub-title {
        font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500;
        color: #94a3b8; letter-spacing: 3px; text-transform: uppercase; margin-top: 36px; z-index: 10;
      }
      .feature-strip {
        display: flex; gap: 20px; margin-top: 48px; z-index: 10;
      }
      .strip-item {
        font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600;
        color: #e2e8f0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px; padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="scene1"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div class="scene-1">
        <div class="glow-bg" id="glow"></div>
        <div class="badge-tag" id="badge">Smart India Hackathon 2026 · Ministry of Defence · BEL</div>
        <div class="main-title" id="title">
          LEXCORP ENTERPRISE<br><span class="gradient-text">BLOCKCHAIN DEFENSE PLATFORM</span>
        </div>
        <div class="sub-title" id="subtitle">Air-Gapped Zero-Trust Security · Decentralized ID · Digital Asset Twins</div>
        <div class="feature-strip" id="features">
          <div class="strip-item">W3C DID v1.1</div>
          <div class="strip-item">Zero-Gas Hyperledger Besu</div>
          <div class="strip-item">Local AI Anomaly Engine</div>
          <div class="strip-item">Non-Custodial Cryptography</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#glow", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.5, ease: "power2.out" }, 0);
      tl.fromTo("#badge", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.fromTo("#title", { opacity: 0, scale: 0.9, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.5);
      tl.fromTo("#subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.1);
      tl.fromTo("#features", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.6);
      window.__timelines["scene1"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1920px; height: 1080px; overflow: hidden; background: #080a18; font-family: 'Inter', sans-serif; }
      .scene-5 { position: absolute; width: 100%; height: 100%; padding: 60px 200px; display: flex; align-items: center; justify-content: space-between; }
      .verify-card { background: #0c1222; border: 1px solid #1e293b; border-radius: 20px; padding: 40px; width: 600px; }
      .verification-badge { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: #34d399; background: rgba(52,211,153,0.1); border: 1px solid #34d399; border-radius: 8px; padding: 12px 24px; }
      .asset-info { font-size: 24px; color: #f8fafc; margin-top: 24px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene5" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <div class="scene-5">
        <div style="font-size: 48px; font-weight: 800; color: #f8fafc;">/verify/BEL-RADAR-2026-001</div>
        <div class="verify-card" id="card">
          <div class="verification-badge">✓ CRYPTOGRAPHIC HASH VERIFIED</div>
          <div class="asset-info">
            <strong>Owner:</strong> did:ethr:13371:0x709...<br>
            <strong>Status:</strong> Active & Compliant<br>
            <strong>Twin Hash:</strong> 0x9e4b...d38a
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 0.5);
      window.__timelines["scene5"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

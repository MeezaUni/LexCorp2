<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0914; font-family: 'Inter', sans-serif; }

      .scene-4 {
        position: absolute; width: 100%; height: 100%; background: #0b0914; padding: 60px 100px;
      }
      .dash-card {
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px; padding: 40px;
      }
      .access-row {
        display: flex; align-items: center; justify-content: space-between;
        background: rgba(255,255,255,0.04); border-radius: 10px; padding: 20px;
        margin-bottom: 12px;
      }
      .access-text { font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #f8fafc; }
      .grant-btn {
        font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;
        background: rgba(170,59,255,0.15); border: 1px solid rgba(170,59,255,0.35);
        color: #c084fc; padding: 8px 16px; border-radius: 6px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="scene4"
      data-start="0"
      data-duration="6.5"
      data-width="1920"
      data-height="1080"
    >
      <div class="scene-4">
        <div class="dash-card">
          <div style="font-size: 20px; font-weight: 700; color: #f8fafc; margin-bottom: 24px;">DID-Based RBAC Delegation</div>
          <div class="access-row" id="row-1">
            <span class="access-text">did:ethr:13371:0x7099...79C8 (Field Operator)</span>
            <span class="access-text" style="color: #34d399;">READ_WRITE</span>
            <button class="grant-btn">Revoke</button>
          </div>
          <div class="access-row" id="row-2">
            <span class="access-text">did:ethr:13371:0x90F7...4B1A (Maintenance)</span>
            <span class="access-text" style="color: #38bdf8;">READ_ONLY</span>
            <button class="grant-btn">Upgrade</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#row-1", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.5 }, 0.5);
      tl.fromTo("#row-2", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.5 }, 1.0);
      window.__timelines["scene4"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

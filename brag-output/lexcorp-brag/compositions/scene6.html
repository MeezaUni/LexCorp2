<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; font-family: 'Inter', sans-serif; }
      .scene-6 { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      .metamask-modal { background: #1e293b; border-radius: 16px; padding: 32px; width: 450px; text-align: center; border: 1px solid #334155; }
      .mm-title { font-size: 20px; font-weight: 600; color: #f8fafc; margin-bottom: 24px; }
      .sign-btn { background: #1d4ed8; color: white; padding: 12px 24px; border-radius: 8px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene6" data-start="0" data-duration="6.5" data-width="1920" data-height="1080">
      <div class="scene-6">
        <div class="metamask-modal" id="modal">
          <div class="mm-title">Signature Request</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #94a3b8; margin-bottom: 24px;">Sign message to decrypt & authorize download.</div>
          <button class="sign-btn" id="sign">Sign & Download</button>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#modal", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.2)" }, 0.5);
      tl.to("#sign", { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 }, 2.0);
      window.__timelines["scene6"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

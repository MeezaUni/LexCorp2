# LexCorp - local PostgreSQL (bound to localhost; password from the git-ignored .env)

# Fixed project name: the database lives in the volume "lexcorp2_postgres_data", named when the
# folder was LexCorp2. Pinning it keeps that volume whatever the folder is called; changing it
# would start an empty database.
name: lexcorp2

services:
  postgres:
    image: postgres:16-alpine
    container_name: lexcorp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexcorp_sih
      POSTGRES_USER: lexcorp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python scripts/init_secrets.py to create .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexcorp -d lexcorp_sih"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:

# LexCorp QBFT network (chain 13371): 3 validators.
# Static file. The machine-specific parts are git-ignored and written by
# scripts/generate_besu_network.py (run automatically by `npm run setup`):
#   networkFiles/genesis.json, networkFiles/keys/, and .env (BESU_NODE1_ENODE, a public key).
# JSON-RPC is published on 127.0.0.1 only with the ETH/NET/WEB3/QBFT APIs and no browser
# origins; browsers go through the authenticated backend relay /api/chain/rpc.
# The subnet is outside Docker's default address pools so it doesn't clash with other networks.
x-besu-def: &besu-def
  image: hyperledger/besu:26.8.1
  restart: unless-stopped
  entrypoint:
    - besu
    - --data-path=/opt/besu/data
    - --genesis-file=/opt/besu/networkFiles/genesis.json
    - --rpc-http-enabled
    - --rpc-http-api=ETH,NET,WEB3,QBFT
    - --rpc-http-host=0.0.0.0
    - --host-allowlist=localhost,127.0.0.1
    - --min-gas-price=0
    - --sync-mode=FULL
    - --rpc-http-max-active-connections=80

services:
  node1:
    <<: *besu-def
    container_name: besu_node1
    command: >
      --node-private-key-file=/opt/besu/networkFiles/keys/node1/key
      --p2p-port=30303
      --rpc-http-port=8545
    volumes:
      - ./networkFiles:/opt/besu/networkFiles:ro
      - ./data/node1:/opt/besu/data
    ports:
      - "127.0.0.1:8545:8545"
    networks:
      besu-network:
        ipv4_address: 10.137.71.10

  node2:
    <<: *besu-def
    container_name: besu_node2
    command: >
      --node-private-key-file=/opt/besu/networkFiles/keys/node2/key
      --p2p-port=30303
      --bootnodes=enode://${BESU_NODE1_ENODE:?run npm run setup first}@10.137.71.10:30303
    volumes:
      - ./networkFiles:/opt/besu/networkFiles:ro
      - ./data/node2:/opt/besu/data
    networks:
      besu-network:
        ipv4_address: 10.137.71.11

  node3:
    <<: *besu-def
    container_name: besu_node3
    command: >
      --node-private-key-file=/opt/besu/networkFiles/keys/node3/key
      --p2p-port=30303
      --bootnodes=enode://${BESU_NODE1_ENODE:?run npm run setup first}@10.137.71.10:30303
    volumes:
      - ./networkFiles:/opt/besu/networkFiles:ro
      - ./data/node3:/opt/besu/data
    networks:
      besu-network:
        ipv4_address: 10.137.71.12

networks:
  besu-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.137.71.0/24

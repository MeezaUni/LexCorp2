# LexCorp remote access, GATEWAY: runs on the public server (e.g. a free Oracle Cloud VM).
#
#   internet --UDP VPN_PORT--> openvpn 172.29.0.2 --(site link, HTTPS only)--> site: caddy 172.30.0.10 --> LexCorp
#   browser  --TCP LOGIN_PORT--> caddy 172.29.0.4 --> auth 172.29.0.3 --> Google
#   anyone   --TCP 443--> caddy 172.29.0.4 (VERIFY_HOST) --(site link)--> site: caddy 172.30.0.10:8080 --> verify pages only
#   site machine --UDP 51820--> openvpn (WireGuard end of the site link)
#
#   docker compose -f gateway.compose.yml --env-file gateway.env up -d
# See README.md. Keys, certificates and the client profile live under ./data (never committed).
name: lexcorp-vpn-gateway

services:
  openvpn:
    image: lexcorp-vpn:local
    build: ./openvpn
    entrypoint: ["/usr/local/bin/entrypoint-openvpn.sh"]
    environment:
      VPN_HOST: ${VPN_HOST}
      VPN_PORT: ${VPN_PORT:-1194}
      APP_IP: 172.30.0.10
      SITE_NET: 172.30.0.0/24
      MGMT_ADDR: 172.29.0.2
      VERIFY_PROXY: 172.29.0.4
      WG_GATEWAY_PRIVATE_KEY: ${WG_GATEWAY_PRIVATE_KEY}
      WG_SITE_PUBLIC_KEY: ${WG_SITE_PUBLIC_KEY}
      WG_PRESHARED_KEY: ${WG_PRESHARED_KEY}
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "${VPN_PORT:-1194}:1194/udp"
      - "51820:51820/udp"
    volumes: ["./data/openvpn:/data"]
    networks:
      gw: {ipv4_address: 172.29.0.2}
    restart: unless-stopped

  auth:
    image: lexcorp-vpn:local
    entrypoint: ["/usr/local/bin/entrypoint-auth.sh"]
    depends_on: [openvpn]
    environment:
      VPN_HOST: ${VPN_HOST}
      LOGIN_PORT: ${LOGIN_PORT:-9443}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      MGMT_ADDR: 172.29.0.2
    volumes: ["./data/openvpn/shared:/shared:ro"]
    networks:
      gw: {ipv4_address: 172.29.0.3}
    restart: unless-stopped

  caddy:
    image: lexcorp-vpn-caddy:local
    build: ./caddy
    environment:
      CADDY_ROLE: gateway
      VPN_HOST: ${VPN_HOST}
      VERIFY_HOST: ${VERIFY_HOST:-lexcorp-verify.duckdns.org}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
      SITE_ROUTE_VIA: 172.29.0.2
      SITE_NET: 172.30.0.0/24
    cap_add: [NET_ADMIN]
    ports: ["${LOGIN_PORT:-9443}:9443/tcp", "443:443/tcp"]
    volumes: ["./data/caddy:/data"]
    networks:
      gw: {ipv4_address: 172.29.0.4}
    restart: unless-stopped

  # Keeps the DuckDNS names right: the VPN and verify names follow this server's public IP, the app
  # name points to the web proxy's private address at the site (reachable only through the VPN).
  duckdns:
    image: curlimages/curl:latest
    environment:
      VPN_HOST: ${VPN_HOST}
      APP_HOST: ${APP_HOST}
      VERIFY_HOST: ${VERIFY_HOST:-lexcorp-verify.duckdns.org}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          vpn=$$(curl -fsS "https://www.duckdns.org/update?domains=$${VPN_HOST%.duckdns.org}&token=$${DUCKDNS_TOKEN}&ip=")
          verify=$$(curl -fsS "https://www.duckdns.org/update?domains=$${VERIFY_HOST%.duckdns.org}&token=$${DUCKDNS_TOKEN}&ip=")
          app=$$(curl -fsS "https://www.duckdns.org/update?domains=$${APP_HOST%.duckdns.org}&token=$${DUCKDNS_TOKEN}&ip=172.30.0.10")
          echo "$$(date -u +%FT%TZ) DuckDNS update: $${VPN_HOST}=$${vpn} $${VERIFY_HOST}=$${verify} $${APP_HOST}=$${app}"
          sleep 300
        done
    restart: unless-stopped

networks:
  gw:
    ipam:
      config: [{subnet: 172.29.0.0/24}]

services:
  wg-easy:
    environment:
      # Public IP Address for remote access over the Internet
      - WG_HOST=182.71.109.122

      # Web portal password hash (bcrypt) - supplied via network/vpn/.env, never committed
      - PASSWORD_HASH=${WG_PASSWORD_HASH:?set WG_PASSWORD_HASH in network/vpn/.env}

      # WireGuard Port
      - WG_PORT=52000
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=1.1.1.1
      - WG_MTU=1420
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy
    volumes:
      - ./wireguard_data:/etc/wireguard
    ports:
      - "52000:52000/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
